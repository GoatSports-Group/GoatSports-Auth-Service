server.port=${SERVER_PORT}

spring.application.name=GOATSPORTS-AUTH-SERVICE
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true
spring.data.redis.database=0

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token.expiration-second=${JWT_ACCESS_TOKEN_EXPIRATION_SECOND}
app.jwt.refresh-token.expiration-second=${JWT_REFRESH_TOKEN_EXPIRATION_SECOND}
app.verify-code-validity-in-second=${VERIFICATION_CODE_VALIDITY_IN_SECOND}

keycloak.token-uri=${KEYCLOAK_TOKEN_URI}
keycloak.logout-uri=${KEYCLOAK_LOGOUT_URI}
keycloak.client-id=${KEYCLOAK_CLIENT_ID}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
keycloak.user-uri=${KEYCLOAK_USER_URI}
keycloak.admin.token-uri=${KEYCLOAK_ADMIN_TOKEN_URI}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID}
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD}

spring.mail.host=smtp.gmail.com
spring.mail.port=${PORT_MAIL}
spring.mail.username=${USERNAME_MAIL}
spring.mail.password=${PASSWORD_MAIL}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

management.endpoints.web.exposure.include=health,prometheus,info
management.prometheus.metrics.export.enabled=true

app.cookie.domain=${COOKIE_DOMAIN}
app.cookie.secure=${COOKIE_SECURE}