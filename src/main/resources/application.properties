# APPLICATION
spring.application.name=GOATSPORTS-AUTH-SERVICE
spring.threads.virtual.enabled=true
server.port=${SERVER_PORT}
# SQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
# REDIS
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=0
spring.data.redis.client-type=lettuce
spring.data.redis.repositories.enabled=false
spring.data.redis.ssl.enabled=true
# KAFKA
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=iuh.fit.auth.application.dto.event.UserRegistrationEvent
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.topic.user-registration=${KAFKA_TOPIC_USER_REGISTRATION}
spring.kafka.topic.user-sync=${KAFKA_TOPIC_USER_SYNC}
# EUREKA
eureka.client.enabled=${EUREKA_CLIENT_ENABLED}
spring.cloud.discovery.enabled=${EUREKA_DISCOVERY_ENABLED}
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL}
eureka.instance.prefer-ip-address=${EUREKA_SERVICE_PREFER_IP_ADDRESS}
# KEYCLOAK
keycloak.token-uri=${KEYCLOAK_TOKEN_URI}
keycloak.logout-uri=${KEYCLOAK_LOGOUT_URI}
keycloak.server-url=${KEYCLOAK_SERVER_URL}
keycloak.callback-url=${KEYCLOAK_CALLBACK_URL}
keycloak.admin.username=${KEYCLOAK_ADMIN_USERNAME}
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD}
keycloak.realm-master=${KEYCLOAK_REALM_MASTER}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID}
keycloak.current-realm=${KEYCLOAK_CURRENT_REALM}
keycloak.client-id=${KEYCLOAK_CLIENT_ID}
# CAMUNDA
camunda.client.mode=${CAMUNDA_CLIENT_MODE}
camunda.client.cloud.cluster-id=${CAMUNDA_CLUSTER_ID}
camunda.client.cloud.region=${CAMUNDA_CLUSTER_REGION}
camunda.client.auth.client-id=${CAMUNDA_CLIENT_ID}
camunda.client.auth.client-secret=${CAMUNDA_CLIENT_SECRET}
camunda.client.auth.connect-timeout=${CAMUNDA_CLIENT_CONNECT_TIMEOUT}
camunda.client.request-timeout=${CAMUNDA_CLIENT_REQUEST_TIMEOUT}
camunda.client.worker.defaults.request-timeout=${CAMUNDA_CLIENT_WORKER_REQUEST_TIMEOUT}
# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token.expiration-second=${JWT_ACCESS_TOKEN_EXPIRATION_SECOND}
app.jwt.refresh-token.expiration-second=${JWT_REFRESH_TOKEN_EXPIRATION_SECOND}
app.verify-code-validity-in-second=${VERIFICATION_CODE_VALIDITY_IN_SECOND}
# COOKIE
app.cookie.domain=${COOKIE_DOMAIN}
app.cookie.secure=${COOKIE_SECURE}
# MAIL
spring.mail.host=smtp.gmail.com
spring.mail.port=${PORT_MAIL}
spring.mail.username=${USERNAME_MAIL}
spring.mail.password=${PASSWORD_MAIL}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# ACTUATOR
management.endpoints.web.exposure.include=health,info,prometheus
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.UP=200
management.endpoint.health.status.http-mapping.DOWN=503
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# LOGGING
logging.level.root=INFO
logging.level.me.minhdat=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
# SWAGGER
springdoc.api-docs.enabled=false
springdoc.api-docs.version=openapi_3_0
springdoc.swagger-ui.enabled=false
# PAGINATION
spring.data.web.pageable.one-indexed-parameters=true
spring.data.web.pageable.max-page-size=20
# FILE UPLOAD
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
# JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh
# FRONTEND URL
client.frontend.url=${CLIENT_FRONTEND_URL}
admin.frontend.url=${ADMIN_FRONTEND_URL}