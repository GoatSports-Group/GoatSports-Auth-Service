<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Goat Sports</title>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif;">
    <table style="max-width: 80rem; min-height: 100vh; padding: 2rem; margin: 0 auto; background-color: #f5f5f5;">
        <tr>
            <td align="center">
                <table style="background-color: white; border-radius: 5px; padding: 20px; text-align: left;">
                    <tr>
                        <td>
                            <div style="text-align: left; font-size: 20px; font-weight: bold; color: #333;">Goat Sports</div>
                        </td>
                        <td style="text-align: right;">
                            <div style="font-size: 16px; color: #666;">Thông báo cập nhật mật khẩu</div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" style="margin: 15px 0; border-top: 1px solid rgba(5, 5, 5, 0.06);"></td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <h2 style="color: #333;">Xin chào <span th:text="${fullName}">Người dùng</span>!</h2>
                            <p style="font-size: 16px; line-height: 1.5; color: #555;">
                                Mật khẩu tài khoản của bạn đã được cập nhật thành công bởi Quản trị viên (Admin).
                            </p>
                            <div style="background-color: #fff; padding: 20px; border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.05); border: 1px solid #eee; margin: 20px 0;">
                                <h3 style="color: #333; margin-top: 0;">Thông tin mật khẩu mới:</h3>
                                <p style="font-size: 18px; font-weight: bold; color: #28a745; margin: 10px 0;" th:text="${newPassword}"></p>
                                <p style="font-size: 14px; color: #888; margin-bottom: 0;">
                                    * Vui lòng đăng nhập và thay đổi mật khẩu ngay để bảo mật tài khoản.
                                </p>
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <div style="padding-top: 20px; text-align: left; font-size: 16px;">Trân trọng,</div>
                            <div style="text-align: left; font-size: 16px; font-weight: bold; color: #007bff;">Goat Sports.</div>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
